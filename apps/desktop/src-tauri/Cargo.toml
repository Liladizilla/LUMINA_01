[package]
name = "lumina-studio"
version = "1.0.0"
description = "Lumina Studio - AI-Powered Video Editor"
authors = ["Lumina Team"]
edition = "2021"

[lib]
name = "lumina_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

